<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFM — connexion</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#12141c;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;color:#e8eaf0}
  .carte{background:#1a1d28;border:1px solid #262a38;border-radius:16px;padding:30px;max-width:380px;width:100%}
  .logo{display:flex;align-items:center;gap:9px;margin-bottom:26px}
  .pastille{width:32px;height:32px;border-radius:8px;background:rgba(79,126,248,.18);
    border:1px solid rgba(79,126,248,.45);display:grid;place-items:center;flex:none}
  .pastille div{width:12px;height:15px;background:#4f7ef8;border-radius:6px 6px 2px 2px}
  .nom{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .sous{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#6b7280;margin-top:3px}
  label{display:block;font-size:12px;color:#9ba3b8;margin-bottom:7px}
  input{width:100%;padding:12px 13px;border:1px solid #2e3346;border-radius:9px;background:#12141c;
    color:#e8eaf0;font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:#4f7ef8}
  button{width:100%;margin-top:16px;padding:12px;border:none;border-radius:9px;background:#4f7ef8;
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  button:hover{background:#3d6ce8}
  .souci{margin-top:14px;padding:11px 13px;border-radius:9px;background:rgba(208,59,59,.14);
    border:1px solid rgba(208,59,59,.4);color:#ff9b9b;font-size:13px;line-height:1.5}
  .note{margin-top:20px;padding-top:16px;border-top:1px solid #262a38;font-size:11.5px;
    color:#6b7280;line-height:1.65}
</style>
</head>
<body>
  <form class="carte" method="post" action="/connexion">
    <div class="logo">
      <div class="pastille"><div></div></div>
      <div><div class="nom">DFM</div><div class="sous">Dental Formation Manager</div></div>
    </div>
    <label for="mdp">Mot de passe</label>
    <input id="mdp" name="mot_de_passe" type="password" autofocus autocomplete="current-password">
    <input type="hidden" name="suite" value="{{ suite }}">
    <button type="submit">Ouvrir DFM</button>
    {% if souci %}<div class="souci">{{ souci }}</div>{% endif %}
    <div class="note">
      Cet outil contient des données personnelles et les pièces que vous devrez
      présenter en audit. Mot de passe oublié&nbsp;: lancez
      <code>python3 mot_de_passe.py</code> sur la machine.
    </div>
  </form>
</body>
</html>
